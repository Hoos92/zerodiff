name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.8", "3.12"]
        include:
          - os: macos-latest
            python: "3.12"
        exclude:
          - os: ubuntu-latest
            python: "3.8"   # ubuntu-latest images no longer ship 3.8
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e .[dev]
      - run: python -m pytest tests/ -q
      - name: demo smoke test
        run: zerodiff demo
      - name: dogfood the quality gate on our own source
        shell: bash
        run: zerodiff quality zerodiff/*.py
