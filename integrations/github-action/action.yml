name: "ZeroDiff behavioral gate"
description: >-
  Replay recorded behavioral traces against the code in this PR and fail
  the check if any recorded behavior diverged. Works on code written by
  any agent or human.
branding:
  icon: "check-circle"
  color: "green"

inputs:
  traces-dir:
    description: "Directory containing recorded .jsonl traces"
    required: false
    default: "traces"
  map:
    description: "Optional OLD:NEW module mapping (repeat with commas)"
    required: false
    default: ""
  workdir:
    description: "Directory to run in (where the rewrite is importable)"
    required: false
    default: "."
  isolate:
    description: "Replay each call in a worker subprocess (crash-proof)"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Install zerodiff
      shell: bash
      # once published on PyPI this becomes simply: pip install zerodiff
      run: pip install "zerodiff @ git+https://github.com/Hoos92/zerodiff"
    - name: Replay recorded behaviors
      shell: bash
      working-directory: ${{ inputs.workdir }}
      run: |
        ARGS=(-t "${{ inputs.traces-dir }}")
        if [ "${{ inputs.isolate }}" = "true" ]; then ARGS+=(--isolate); fi
        IFS=',' read -ra MAPS <<< "${{ inputs.map }}"
        for m in "${MAPS[@]}"; do
          [ -n "$m" ] && ARGS+=(--map "$m")
        done
        zerodiff replay "${ARGS[@]}"
    - name: Upload report
      if: always()
      shell: bash
      working-directory: ${{ inputs.workdir }}
      run: |
        if [ -f zerodiff-report.md ]; then
          echo "## ZeroDiff behavioral report" >> "$GITHUB_STEP_SUMMARY"
          cat zerodiff-report.md >> "$GITHUB_STEP_SUMMARY"
        fi
