[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zerodiff"
dynamic = ["version"]
description = "Behavioral equivalence harness: record what your legacy code really does, replay it against an AI rewrite, and get every divergence as an actionable report."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "ZeroDiff contributors" }]
keywords = ["testing", "migration", "ai-agents", "characterization-testing", "verification"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
zerodiff = "zerodiff.cli:main"

[project.urls]
Homepage = "https://github.com/Hoos92/zerodiff"
Issues = "https://github.com/Hoos92/zerodiff/issues"
Changelog = "https://github.com/Hoos92/zerodiff/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["zerodiff"]

[tool.setuptools.dynamic]
version = { attr = "zerodiff.__version__" }
